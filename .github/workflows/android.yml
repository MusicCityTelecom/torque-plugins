name: Android plugin build

on:
  push:
    paths:
      - "plugins/c5-diagnostics/android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "plugins/c5-diagnostics/android/**"
      - ".github/workflows/android.yml"

jobs:
  build-c5-diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Test and build debug APK
        working-directory: plugins/c5-diagnostics/android
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: c5-diagnostics-debug
          path: plugins/c5-diagnostics/android/app/build/outputs/apk/debug/app-debug.apk
