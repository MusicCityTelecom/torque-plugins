name: Android plugin build

on:
  push:
    paths:
      - "plugins/c5-diagnostics/android/**"
      - "plugins/c5-abs-reset/android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "plugins/c5-diagnostics/android/**"
      - "plugins/c5-abs-reset/android/**"
      - ".github/workflows/android.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        plugin:
          - c5-diagnostics
          - c5-abs-reset

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Test and build debug APK
        working-directory: plugins/${{ matrix.plugin }}/android
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.plugin }}-debug
          path: plugins/${{ matrix.plugin }}/android/app/build/outputs/apk/debug/app-debug.apk
